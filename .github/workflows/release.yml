name: Release Binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
      - name: Install Python dependencies
        shell: pwsh
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: "offscreen"
        run: python -m pytest --basetemp .tmp\pytest-run
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = ($env:GITHUB_REF_NAME).TrimStart("v")
          .\packaging\build_windows.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: artifacts/ShaoLv-Music-Converter-Setup-*.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
      - name: Install Linux runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg libegl1 libgl1 libxkbcommon-x11-0 libxkbcommon0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libdbus-1-3 \
            libfontconfig1 xvfb
      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        env:
          QT_QPA_PLATFORM: "offscreen"
        run: python -m pytest --basetemp .tmp/pytest-run
      - name: Build Linux tar package
        env:
          SHAOLV_VERSION: "${{ github.ref_name }}"
        run: |
          export SHAOLV_VERSION="${SHAOLV_VERSION#v}"
          bash packaging/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: artifacts/*-linux-x86_64.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Assemble release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find release-assets -type f -exec cp {} release/ \;
          cp packaging/skill-installers/*.cmd packaging/skill-installers/*.sh release/
          python scripts/package_skill.py \
            --output "release/music-format-converter-skill-${GITHUB_REF_NAME#v}.zip"
          cd release
          sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 ||
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          gh release upload "${GITHUB_REF_NAME}" release/* --clobber

